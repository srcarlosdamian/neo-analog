name: Release LadderMono

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Build & Package Release (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, windows-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Ninja
        uses: ashutoshvarma/setup-ninja@master

      - name: Setup MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build macOS Release
        if: runner.os == 'macOS'
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          cmake --build build --target LadderMono_Standalone LadderMono_VST3 LadderMono_AU LadderMono_CLAP --config Release
          cd build/LadderMono_artefacts
          zip -r ../../LadderMono-macOS-Universal.zip Standalone VST3 AU CLAP

      - name: Build Windows Release
        if: runner.os == 'Windows'
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target LadderMono_Standalone LadderMono_VST3 LadderMono_CLAP --config Release
          cd build/LadderMono_artefacts
          Compress-Archive -Path Standalone, VST3, CLAP -DestinationPath ../../LadderMono-Windows-x64.zip

      - name: Publish GitHub Release Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            LadderMono-macOS-Universal.zip
            LadderMono-Windows-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
